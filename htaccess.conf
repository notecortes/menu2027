# ==============================================================================
# MedDiet Pro — Configuración de Servidor Apache (.htaccess)
# Compatible con Servidores Compartidos (cPanel, Plesk, Hostinger, Raiola) y Docker
# ==============================================================================

# Evitar listado de directorios
Options -Indexes

# Codificación estándar UTF-8
AddDefaultCharset UTF-8

# Prioridad de archivos de índice (PHP primero)
DirectoryIndex index.php index.html

# ------------------------------------------------------------------------------
# 1. Seguridad: Denegar acceso directo a archivos sensibles de configuración, SQL y Docker
# ------------------------------------------------------------------------------
<FilesMatch "(^\.env|^\.git|docker-compose\.ya?ml|Dockerfile.*|.*\.sql|.*\.sh|htaccess\.conf|db\.local\.php)$">
  <IfModule mod_authz_core.c>
    Require all denied
  </IfModule>
  <IfModule !mod_authz_core.c>
    Order deny,allow
    Deny from all
  </IfModule>
</FilesMatch>

# ------------------------------------------------------------------------------
# 2. Motor de Reescritura (mod_rewrite)
# ------------------------------------------------------------------------------
<IfModule mod_rewrite.c>
  RewriteEngine On

  # Proteger carpetas internas de acceso web directo
  RewriteRule ^(sql|data|config)/ - [F,L]

  # Enrutar peticiones a la API si se invocan desde /public/
  RewriteRule ^public/api/(.*)$ api/$1 [L]

  # Compatibilidad si no existe la carpeta assets/ en la raíz (subdirectorios o servidores LiteSpeed/Apache)
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^assets/(.*)$ public/assets/$1 [L,QSA]
</IfModule>

# ------------------------------------------------------------------------------
# 3. Rendimiento: Compresión GZIP de texto, JSON, CSS y JS
# ------------------------------------------------------------------------------
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
</IfModule>

# ------------------------------------------------------------------------------
# 4. Rendimiento: Cabeceras de expiración y caché para assets estáticos
# ------------------------------------------------------------------------------
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType image/jpeg "access plus 1 month"
  ExpiresByType image/png "access plus 1 month"
  ExpiresByType image/webp "access plus 1 month"
  ExpiresByType text/css "access plus 1 week"
  ExpiresByType application/javascript "access plus 1 week"
</IfModule>
